[/Script/EngineSettings.GameMapsSettings]
; El nivel se genera por código, así que basta con el mapa vacío del motor.
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/JJDoom.JJGameMode

[/Script/Engine.RendererSettings]
; Calidad equilibrada para que vaya fluido en tarjetas gráficas normales:
; iluminación global y reflejos en pantalla (más baratos que Lumen) y sombras clásicas.
r.DynamicGlobalIlluminationMethod=2
r.ReflectionMethod=2
r.Shadow.Virtual.Enable=0
r.GenerateMeshDistanceFields=False
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.AntiAliasingMethod=2

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

[SystemSettings]
; Texturas a mitad de resolución y menos memoria de vídeo (los modelos de Fab/Paragon usan texturas 4K).
r.Streaming.PoolSize=1000
r.Streaming.MipBias=1
r.ScreenPercentage=85
r.Shadow.MaxResolution=1024
r.VolumetricFog=0
