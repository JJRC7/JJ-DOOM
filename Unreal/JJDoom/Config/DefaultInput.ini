[/Script/Engine.InputSettings]
; Se usa el sistema de entrada clásico para no depender de assets de Enhanced Input.
DefaultPlayerInputClass=/Script/Engine.PlayerInput
DefaultInputComponentClass=/Script/Engine.InputComponent
bEnableLegacyInputScales=True
+AxisMappings=(AxisName="MoveForward",Scale=1.000000,Key=W)
+AxisMappings=(AxisName="MoveForward",Scale=-1.000000,Key=S)
+AxisMappings=(AxisName="MoveForward",Scale=1.000000,Key=Up)
+AxisMappings=(AxisName="MoveForward",Scale=-1.000000,Key=Down)
+AxisMappings=(AxisName="MoveForward",Scale=-1.000000,Key=Gamepad_LeftY)
+AxisMappings=(AxisName="MoveRight",Scale=1.000000,Key=D)
+AxisMappings=(AxisName="MoveRight",Scale=-1.000000,Key=A)
+AxisMappings=(AxisName="MoveRight",Scale=1.000000,Key=Gamepad_LeftX)
+AxisMappings=(AxisName="Turn",Scale=1.000000,Key=MouseX)
+AxisMappings=(AxisName="LookUp",Scale=-1.000000,Key=MouseY)
+AxisMappings=(AxisName="TurnRate",Scale=1.000000,Key=Right)
+AxisMappings=(AxisName="TurnRate",Scale=-1.000000,Key=Left)
+AxisMappings=(AxisName="TurnRate",Scale=1.000000,Key=Gamepad_RightX)
+AxisMappings=(AxisName="LookUpRate",Scale=-1.000000,Key=Gamepad_RightY)
+ActionMappings=(ActionName="Fire",Key=LeftMouseButton)
+ActionMappings=(ActionName="Fire",Key=SpaceBar)
+ActionMappings=(ActionName="Fire",Key=Gamepad_RightTrigger)
+ActionMappings=(ActionName="Use",Key=E)
+ActionMappings=(ActionName="Use",Key=Gamepad_FaceButton_Bottom)
+ActionMappings=(ActionName="Sprint",Key=LeftShift)
+ActionMappings=(ActionName="Sprint",Key=Gamepad_LeftThumbstick)
+ActionMappings=(ActionName="Flashlight",Key=F)
+ActionMappings=(ActionName="Continue",Key=Enter)
+ActionMappings=(ActionName="Weapon1",Key=One)
+ActionMappings=(ActionName="Weapon2",Key=Two)
+ActionMappings=(ActionName="Weapon3",Key=Three)
+ActionMappings=(ActionName="Weapon4",Key=Four)
+ActionMappings=(ActionName="NextWeapon",Key=MouseScrollDown)
+ActionMappings=(ActionName="NextWeapon",Key=Gamepad_RightShoulder)
+ActionMappings=(ActionName="PrevWeapon",Key=MouseScrollUp)
+ActionMappings=(ActionName="PrevWeapon",Key=Gamepad_LeftShoulder)
+ActionMappings=(ActionName="BrightnessUp",Key=PageUp)
+ActionMappings=(ActionName="BrightnessUp",Key=Add)
+ActionMappings=(ActionName="BrightnessUp",Key=Equals)
+ActionMappings=(ActionName="BrightnessDown",Key=PageDown)
+ActionMappings=(ActionName="BrightnessDown",Key=Subtract)
+ActionMappings=(ActionName="BrightnessDown",Key=Hyphen)
; Menús (inicio, pausa y opciones). En el editor ESC detiene la partida: usa P para pausar.
+ActionMappings=(ActionName="Pause",Key=P)
+ActionMappings=(ActionName="Pause",Key=Escape)
+ActionMappings=(ActionName="Pause",Key=Gamepad_Special_Right)
+ActionMappings=(ActionName="MenuBack",Key=BackSpace)
+ActionMappings=(ActionName="MenuBack",Key=Gamepad_FaceButton_Right)
+ActionMappings=(ActionName="MenuUp",Key=Up)
+ActionMappings=(ActionName="MenuUp",Key=W)
+ActionMappings=(ActionName="MenuUp",Key=Gamepad_DPad_Up)
+ActionMappings=(ActionName="MenuDown",Key=Down)
+ActionMappings=(ActionName="MenuDown",Key=S)
+ActionMappings=(ActionName="MenuDown",Key=Gamepad_DPad_Down)
+ActionMappings=(ActionName="MenuLeft",Key=Left)
